name: Validate PR470 final numeric PNF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-pr470-final-numeric-pnf.yml"

permissions:
  contents: write

concurrency:
  group: validate-pr470-final-numeric-pnf
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 75
    env:
      SENSIBLAW_LOCAL_POSTGRES_URL: ${{ secrets.SENSIBLAW_CI_ADMIN_DATABASE_URL }}
      RECEIPT: .validation/pr470-final-numeric-pnf.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/streaming-spacy-typed-parser
          persist-credentials: true
          fetch-depth: 0

      - name: Record source and configure committer
        run: |
          mkdir -p .validation
          git config user.name "sensiblaw-validation-bot"
          git config user.email "sensiblaw-validation-bot@users.noreply.github.com"
          git rev-parse HEAD > .validation/pr470-final-source-head.txt

      - name: Format authority surface
        id: format
        continue-on-error: true
        run: |
          mapfile -t files < <(printf '%s\n' \
            src/pnf/numeric_hyperfabric.py \
            src/pnf/numeric_operator_composition.py \
            src/policy/numeric_pnf_compilation.py \
            src/policy/streaming_spacy_parser_execution.py \
            src/storage/postgres/numeric_symbol_store.py \
            src/storage/postgres/numeric_hierarchy_planner.py \
            src/storage/postgres/numeric_hyperfabric_store.py \
            src/storage/postgres/spacy_numeric_projection.py \
            src/storage/postgres/spacy_parser_carrier.py \
            src/storage/postgres/streaming_spacy_execution.py \
            scripts/audit_json_sin_bin.py \
            scripts/audit_numeric_hyperfabric_authority.py \
            tools/audit_numeric_hyperfabric_authority.py \
            tests/architecture/test_no_json_execution_authority.py \
            tests/pnf/test_numeric_hyperfabric.py \
            tests/pnf/test_numeric_operator_composition.py \
            tests/policy/test_streaming_spacy_parser_execution.py \
            tests/storage/test_numeric_hierarchy_planner.py \
            tests/storage/test_numeric_hyperfabric_migration.py \
            tests/storage/test_numeric_strict_publication.py \
            tests/storage/test_streaming_spacy_postgres_integration.py)
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"

      - name: Compile and lint
        id: lint
        continue-on-error: true
        run: |
          uv run python -m compileall -q \
            src/pnf/numeric_hyperfabric.py \
            src/pnf/numeric_operator_composition.py \
            src/policy/numeric_pnf_compilation.py \
            src/policy/streaming_spacy_parser_execution.py \
            src/storage/postgres/numeric_symbol_store.py \
            src/storage/postgres/numeric_hierarchy_planner.py \
            src/storage/postgres/numeric_hyperfabric_store.py \
            src/storage/postgres/spacy_numeric_projection.py \
            src/storage/postgres/spacy_parser_carrier.py \
            src/storage/postgres/streaming_spacy_execution.py \
            scripts/audit_json_sin_bin.py \
            scripts/audit_numeric_hyperfabric_authority.py \
            tools/audit_numeric_hyperfabric_authority.py
          uv run ruff check \
            src/pnf/numeric_hyperfabric.py \
            src/pnf/numeric_operator_composition.py \
            src/policy/numeric_pnf_compilation.py \
            src/policy/streaming_spacy_parser_execution.py \
            src/storage/postgres/numeric_symbol_store.py \
            src/storage/postgres/numeric_hierarchy_planner.py \
            src/storage/postgres/numeric_hyperfabric_store.py \
            src/storage/postgres/spacy_numeric_projection.py \
            src/storage/postgres/spacy_parser_carrier.py \
            src/storage/postgres/streaming_spacy_execution.py \
            scripts/audit_json_sin_bin.py \
            scripts/audit_numeric_hyperfabric_authority.py \
            tools/audit_numeric_hyperfabric_authority.py \
            tests/architecture/test_no_json_execution_authority.py \
            tests/pnf/test_numeric_hyperfabric.py \
            tests/pnf/test_numeric_operator_composition.py \
            tests/policy/test_streaming_spacy_parser_execution.py \
            tests/storage/test_numeric_hierarchy_planner.py \
            tests/storage/test_numeric_hyperfabric_migration.py \
            tests/storage/test_numeric_strict_publication.py \
            tests/storage/test_streaming_spacy_postgres_integration.py

      - name: Authority audits
        id: authority
        continue-on-error: true
        run: |
          uv run python scripts/audit_json_sin_bin.py \
            --write .validation/pr470-final-json-sin-bin.md \
            --check-authority
          uv run python scripts/audit_numeric_hyperfabric_authority.py

      - name: Unit and architecture tests
        id: unit
        continue-on-error: true
        run: |
          uv run pytest -q \
            tests/architecture/test_no_json_execution_authority.py \
            tests/pnf/test_numeric_hyperfabric.py \
            tests/pnf/test_numeric_operator_composition.py \
            tests/policy/test_streaming_spacy_parser_execution.py \
            tests/storage/test_numeric_hierarchy_planner.py \
            tests/storage/test_numeric_hyperfabric_migration.py \
            tests/storage/test_numeric_strict_publication.py \
            tests/storage/test_streaming_spacy_parser_migration.py \
            tests/storage/test_streaming_spacy_parser_model.py

      - name: Provision fresh PostgreSQL database and apply all migrations
        id: database
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output="$(uv run python - <<'PY'
          import os
          from pathlib import Path
          from src.runtime.postgres_provisioning import provision_local_postgres

          run_ref = "pr470-final-{}-{}".format(
              os.environ["GITHUB_RUN_ID"],
              os.environ["GITHUB_RUN_ATTEMPT"],
          )
          url, name = provision_local_postgres(
              admin_url=os.environ["SENSIBLAW_LOCAL_POSTGRES_URL"],
              migration_root=Path("database/postgres_migrations"),
              run_ref=run_ref,
          )
          print(url)
          print(name)
          PY
          )"
          database_url="$(printf '%s\n' "$output" | sed -n '1p')"
          database_name="$(printf '%s\n' "$output" | sed -n '2p')"
          test -n "$database_url"
          test -n "$database_name"
          printf 'database_url=%s\n' "$database_url" >> "$GITHUB_OUTPUT"
          printf 'database_name=%s\n' "$database_name" >> "$GITHUB_OUTPUT"

      - name: Real spawned spaCy/PostgreSQL integration
        id: integration
        if: steps.database.outcome == 'success'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ steps.database.outputs.database_url }}
        run: uv run pytest -q tests/storage/test_streaming_spacy_postgres_integration.py

      - name: Database authority assertions
        id: schema
        if: steps.database.outcome == 'success'
        continue-on-error: true
        run: |
          psql '${{ steps.database.outputs.database_url }}' -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1
                FROM information_schema.columns
               WHERE table_schema = 'execution'
                 AND (
                   table_name LIKE 'semantic_parser_%'
                   OR table_name LIKE 'semantic_pnf_%'
                   OR table_name IN ('semantic_symbol', 'semantic_morph_set')
                 )
                 AND data_type IN ('json', 'jsonb')
            ) THEN
              RAISE EXCEPTION 'numeric parser or PNF authority contains JSON';
            END IF;
            IF NOT EXISTS (
              SELECT 1
                FROM information_schema.columns
               WHERE table_schema = 'execution'
                 AND table_name = 'semantic_pnf_global_lookup'
                 AND column_name IN ('run_id', 'document_id')
               GROUP BY table_schema, table_name
              HAVING count(*) = 2
            ) THEN
              RAISE EXCEPTION 'numeric global lookup scope IDs are absent';
            END IF;
          END;
          $$;
          SQL

      - name: Drop isolated database
        if: always() && steps.database.outputs.database_name != ''
        continue-on-error: true
        run: |
          dropdb --if-exists \
            --host=127.0.0.1 \
            --port=5433 \
            --username=postgres \
            '${{ steps.database.outputs.database_name }}'

      - name: Commit formatted source and validation receipt
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          AUTHORITY: ${{ steps.authority.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          DATABASE: ${{ steps.database.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          SCHEMA: ${{ steps.schema.outcome }}
        run: |
          source_head="$(cat .validation/pr470-final-source-head.txt)"
          overall=passed
          for state in "$FORMAT" "$LINT" "$AUTHORITY" "$UNIT" "$DATABASE" "$INTEGRATION" "$SCHEMA"; do
            test "$state" = success || overall=failed
          done
          {
            printf 'contract=pr470-final-numeric-pnf-validation:v1\n'
            printf 'source_head=%s\n' "$source_head"
            printf 'validated_tree=%s\n' "$(git write-tree)"
            printf 'overall=%s\n' "$overall"
            printf 'format=%s\n' "$FORMAT"
            printf 'lint=%s\n' "$LINT"
            printf 'authority=%s\n' "$AUTHORITY"
            printf 'unit=%s\n' "$UNIT"
            printf 'database=%s\n' "$DATABASE"
            printf 'integration=%s\n' "$INTEGRATION"
            printf 'schema=%s\n' "$SCHEMA"
            printf 'runner=%s\n' "${RUNNER_NAME:-unknown}"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
          } > "$RECEIPT"
          git add \
            src/pnf/numeric_hyperfabric.py \
            src/pnf/numeric_operator_composition.py \
            src/policy/numeric_pnf_compilation.py \
            src/policy/streaming_spacy_parser_execution.py \
            src/storage/postgres/numeric_symbol_store.py \
            src/storage/postgres/numeric_hierarchy_planner.py \
            src/storage/postgres/numeric_hyperfabric_store.py \
            src/storage/postgres/spacy_numeric_projection.py \
            src/storage/postgres/spacy_parser_carrier.py \
            src/storage/postgres/streaming_spacy_execution.py \
            scripts/audit_json_sin_bin.py \
            scripts/audit_numeric_hyperfabric_authority.py \
            tools/audit_numeric_hyperfabric_authority.py \
            tests/architecture/test_no_json_execution_authority.py \
            tests/pnf/test_numeric_hyperfabric.py \
            tests/pnf/test_numeric_operator_composition.py \
            tests/policy/test_streaming_spacy_parser_execution.py \
            tests/storage/test_numeric_hierarchy_planner.py \
            tests/storage/test_numeric_hyperfabric_migration.py \
            tests/storage/test_numeric_strict_publication.py \
            tests/storage/test_streaming_spacy_postgres_integration.py \
            "$RECEIPT"
          if ! git diff --cached --quiet; then
            git commit -m "Record final PR470 numeric PNF validation"
            git pull --rebase origin agent/streaming-spacy-typed-parser
            git push origin HEAD:agent/streaming-spacy-typed-parser
          fi

      - name: Enforce receipt
        if: always()
        run: grep -qx 'overall=passed' "$RECEIPT"
