name: Work-conserving PostgreSQL persistence

on:
  pull_request:
    paths:
      - "database/postgres_migrations/061_work_conserving_document_persistence.sql"
      - "database/postgres_migrations/138_drop_unused_persistence_stage_document_index.sql"
      - "src/storage/postgres/work_conserving_*.py"
      - "src/storage/postgres/pipelined_document_cursor.py"
      - "src/storage/postgres/reusable_persistence_connections.py"
      - "src/storage/postgres/stage_copy_codec.py"
      - "src/storage/postgres/verified_candidate_link_cache.py"
      - "src/storage/postgres/manifest_metadata_hot_path.py"
      - "src/storage/postgres/annotation_metadata_hot_path.py"
      - "src/policy/work_conserving_postgres_corpus_compilation.py"
      - "src/policy/work_conserving_ordered_compilation.py"
      - "scripts/run_complete_tranche_ordered.py"
      - "scripts/watch_work_conserving_persistence.py"
      - "tests/storage/test_work_conserving_persistence.py"
      - "tests/storage/test_work_conserving_token_identity.py"
      - "tests/test_persistence_hot_path_execution.py"
      - "tests/test_persistence_stage_cleanup_contract.py"
      - "tests/test_persistence_superbatch_execution.py"
      - "tests/test_verified_candidate_link_cache.py"
      - "tests/test_manifest_metadata_hot_path.py"
      - "tests/policy/test_work_conserving_ordered_compilation.py"
      - "docs/architecture/WORK_CONSERVING_POSTGRES_PERSISTENCE.md"
      - ".github/workflows/work-conserving-postgres-persistence-pr.yml"
  push:
    branches:
      - "agent/repair-corpus-progress-stage-lifecycle"
    paths:
      - "database/postgres_migrations/061_work_conserving_document_persistence.sql"
      - "database/postgres_migrations/138_drop_unused_persistence_stage_document_index.sql"
      - "src/storage/postgres/work_conserving_*.py"
      - "src/storage/postgres/pipelined_document_cursor.py"
      - "src/storage/postgres/reusable_persistence_connections.py"
      - "src/storage/postgres/stage_copy_codec.py"
      - "src/storage/postgres/verified_candidate_link_cache.py"
      - "src/storage/postgres/manifest_metadata_hot_path.py"
      - "src/storage/postgres/annotation_metadata_hot_path.py"
      - "src/policy/work_conserving_postgres_corpus_compilation.py"
      - "src/policy/work_conserving_ordered_compilation.py"
      - "scripts/run_complete_tranche_ordered.py"
      - "scripts/watch_work_conserving_persistence.py"
      - "tests/storage/test_work_conserving_persistence.py"
      - "tests/storage/test_work_conserving_token_identity.py"
      - "tests/test_persistence_hot_path_execution.py"
      - "tests/test_persistence_stage_cleanup_contract.py"
      - "tests/test_persistence_superbatch_execution.py"
      - "tests/test_verified_candidate_link_cache.py"
      - "tests/test_manifest_metadata_hot_path.py"
      - "tests/policy/test_work_conserving_ordered_compilation.py"
      - "docs/architecture/WORK_CONSERVING_POSTGRES_PERSISTENCE.md"
      - ".github/workflows/work-conserving-postgres-persistence-pr.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sensiblaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sensiblaw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sensiblaw_test

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra test --extra dev

      - name: Compile
        run: |
          uv run python -m py_compile \
            src/storage/postgres/work_conserving_stage.py \
            src/storage/postgres/work_conserving_stage_hot_path.py \
            src/storage/postgres/work_conserving_copy_observability.py \
            src/storage/postgres/work_conserving_graph_batching.py \
            src/storage/postgres/work_conserving_resolution_batching.py \
            src/storage/postgres/work_conserving_binding_batching.py \
            src/storage/postgres/pipelined_document_cursor.py \
            src/storage/postgres/reusable_persistence_connections.py \
            src/storage/postgres/stage_copy_codec.py \
            src/storage/postgres/verified_candidate_link_cache.py \
            src/storage/postgres/manifest_metadata_hot_path.py \
            src/storage/postgres/annotation_metadata_hot_path.py \
            src/storage/postgres/work_conserving_graph_persistence.py \
            src/storage/postgres/work_conserving_language_persistence.py \
            src/storage/postgres/work_conserving_resolution_persistence.py \
            src/storage/postgres/work_conserving_binding_persistence.py \
            src/storage/postgres/work_conserving_persistence.py \
            src/policy/work_conserving_postgres_corpus_compilation.py \
            src/policy/work_conserving_ordered_compilation.py \
            scripts/run_complete_tranche_ordered.py \
            scripts/watch_work_conserving_persistence.py \
            tests/storage/test_work_conserving_persistence.py \
            tests/storage/test_work_conserving_token_identity.py \
            tests/test_persistence_hot_path_execution.py \
            tests/test_persistence_stage_cleanup_contract.py \
            tests/test_persistence_superbatch_execution.py \
            tests/test_verified_candidate_link_cache.py \
            tests/test_manifest_metadata_hot_path.py \
            tests/policy/test_work_conserving_ordered_compilation.py

      - name: Ruff
        run: |
          uv run ruff check \
            src/storage/postgres/work_conserving_stage.py \
            src/storage/postgres/work_conserving_stage_hot_path.py \
            src/storage/postgres/work_conserving_copy_observability.py \
            src/storage/postgres/work_conserving_graph_batching.py \
            src/storage/postgres/work_conserving_resolution_batching.py \
            src/storage/postgres/work_conserving_binding_batching.py \
            src/storage/postgres/pipelined_document_cursor.py \
            src/storage/postgres/reusable_persistence_connections.py \
            src/storage/postgres/stage_copy_codec.py \
            src/storage/postgres/verified_candidate_link_cache.py \
            src/storage/postgres/manifest_metadata_hot_path.py \
            src/storage/postgres/annotation_metadata_hot_path.py \
            src/storage/postgres/work_conserving_graph_persistence.py \
            src/storage/postgres/work_conserving_language_persistence.py \
            src/storage/postgres/work_conserving_resolution_persistence.py \
            src/storage/postgres/work_conserving_binding_persistence.py \
            src/storage/postgres/work_conserving_persistence.py \
            src/policy/work_conserving_postgres_corpus_compilation.py \
            src/policy/work_conserving_ordered_compilation.py \
            scripts/run_complete_tranche_ordered.py \
            scripts/watch_work_conserving_persistence.py \
            tests/storage/test_work_conserving_persistence.py \
            tests/storage/test_work_conserving_token_identity.py \
            tests/test_persistence_hot_path_execution.py \
            tests/test_persistence_stage_cleanup_contract.py \
            tests/test_persistence_superbatch_execution.py \
            tests/test_verified_candidate_link_cache.py \
            tests/test_manifest_metadata_hot_path.py \
            tests/policy/test_work_conserving_ordered_compilation.py

      - name: Apply migrations
        run: bash scripts/apply_pg_migrations.sh

      - name: Focused tests
        run: |
          uv run pytest -q \
            tests/storage/test_work_conserving_persistence.py \
            tests/storage/test_work_conserving_token_identity.py \
            tests/test_persistence_hot_path_execution.py \
            tests/test_persistence_stage_cleanup_contract.py \
            tests/test_persistence_superbatch_execution.py \
            tests/test_verified_candidate_link_cache.py \
            tests/test_manifest_metadata_hot_path.py \
            tests/policy/test_work_conserving_ordered_compilation.py
