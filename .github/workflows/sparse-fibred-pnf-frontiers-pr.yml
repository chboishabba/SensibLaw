name: Sparse fibred PNF frontiers

on:
  pull_request:
    paths:
      - "database/postgres_migrations/062_sparse_fibred_pnf_frontiers.sql"
      - "database/postgres_migrations/063_sparse_actor_profile_null_normalisation.sql"
      - "database/postgres_migrations/064_anaphor_surface_lexical_evidence.sql"
      - "scripts/report_numeric_pnf_frontier.py"
      - "tests/storage/test_sparse_fibred_frontier_migration.py"
      - "tests/storage/test_sparse_fibred_frontier_postgres.py"
      - "tests/storage/test_sparse_fibred_frontier_resolution.py"
      - "docs/architecture/SPARSE_FIBRED_PNF_FRONTIERS.md"
      - ".github/workflows/sparse-fibred-pnf-frontiers-pr.yml"
  push:
    branches:
      - "agent/repair-corpus-progress-stage-lifecycle"
    paths:
      - "database/postgres_migrations/062_sparse_fibred_pnf_frontiers.sql"
      - "database/postgres_migrations/063_sparse_actor_profile_null_normalisation.sql"
      - "database/postgres_migrations/064_anaphor_surface_lexical_evidence.sql"
      - "scripts/report_numeric_pnf_frontier.py"
      - "tests/storage/test_sparse_fibred_frontier_migration.py"
      - "tests/storage/test_sparse_fibred_frontier_postgres.py"
      - "tests/storage/test_sparse_fibred_frontier_resolution.py"
      - "docs/architecture/SPARSE_FIBRED_PNF_FRONTIERS.md"
      - ".github/workflows/sparse-fibred-pnf-frontiers-pr.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sensiblaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sensiblaw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sensiblaw_test

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Compile
        run: |
          uv run python -m py_compile \
            scripts/report_numeric_pnf_frontier.py \
            tests/storage/test_sparse_fibred_frontier_migration.py \
            tests/storage/test_sparse_fibred_frontier_postgres.py \
            tests/storage/test_sparse_fibred_frontier_resolution.py

      - name: Ruff
        run: |
          uv run ruff check \
            scripts/report_numeric_pnf_frontier.py \
            tests/storage/test_sparse_fibred_frontier_migration.py \
            tests/storage/test_sparse_fibred_frontier_postgres.py \
            tests/storage/test_sparse_fibred_frontier_resolution.py

      - name: Static frontier tests
        run: |
          uv run pytest -q \
            tests/storage/test_sparse_fibred_frontier_migration.py

      - name: Apply migrations
        run: bash scripts/apply_pg_migrations.sh

      - name: PostgreSQL frontier tests
        run: |
          uv run pytest -q \
            tests/storage/test_sparse_fibred_frontier_postgres.py \
            tests/storage/test_sparse_fibred_frontier_resolution.py
