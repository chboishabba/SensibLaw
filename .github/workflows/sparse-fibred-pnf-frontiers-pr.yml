permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sensiblaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sensiblaw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sensiblaw_test

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Compile
        run: |
          uv run python -m py_compile \
            src/storage/postgres/epistemic_factor_report.py \
            scripts/report_numeric_pnf_frontier.py \
            scripts/generate_entity_factor_report.py \
            scripts/generate_reagan_factor_report.py \
            tests/storage/test_sparse_fibred_frontier_migration.py \
            tests/storage/test_sparse_actor_profile_integrity_migration.py \
            tests/storage/test_sparse_frontier_constraint_migrations.py \
            tests/storage/test_sparse_frontier_batch_migration.py \
            tests/storage/test_sparse_fibred_frontier_postgres.py \
            tests/storage/test_sparse_fibred_frontier_resolution.py \
            tests/storage/test_typed_frontier_candidate_constraints.py \
            tests/storage/test_proof_relevant_identity_derivations.py \
            tests/storage/test_proof_relevant_identity_postgres.py \
            tests/storage/test_proof_relevant_identity_acceptance.py \
            tests/storage/test_reference_mode_outcomes.py \
            tests/storage/test_epistemic_factor_report.py

      - name: Ruff
        run: |
          uv run ruff check \
            src/storage/postgres/epistemic_factor_report.py \
            scripts/report_numeric_pnf_frontier.py \
            scripts/generate_entity_factor_report.py \
            scripts/generate_reagan_factor_report.py \
            tests/storage/test_sparse_fibred_frontier_migration.py \
            tests/storage/test_sparse_actor_profile_integrity_migration.py \
            tests/storage/test_sparse_frontier_constraint_migrations.py \
            tests/storage/test_sparse_frontier_batch_migration.py \
            tests/storage/test_sparse_fibred_frontier_postgres.py \
            tests/storage/test_sparse_fibred_frontier_resolution.py \
            tests/storage/test_typed_frontier_candidate_constraints.py \
            tests/storage/test_proof_relevant_identity_derivations.py \
            tests/storage/test_proof_relevant_identity_postgres.py \
            tests/storage/test_proof_relevant_identity_acceptance.py \
            tests/storage/test_reference_mode_outcomes.py \
            tests/storage/test_epistemic_factor_report.py

      - name: Static frontier tests
        run: |
          uv run pytest -q \
            tests/storage/test_sparse_fibred_frontier_migration.py \
            tests/storage/test_sparse_actor_profile_integrity_migration.py \
            tests/storage/test_sparse_frontier_constraint_migrations.py \
            tests/storage/test_sparse_frontier_batch_migration.py \
            tests/storage/test_proof_relevant_identity_derivations.py \
            tests/storage/test_reference_mode_outcomes.py \
            tests/storage/test_epistemic_factor_report.py

      - name: Apply migrations
        run: bash scripts/apply_pg_migrations.sh

      - name: PostgreSQL frontier tests
        run: |
          uv run pytest -q \
            tests/storage/test_sparse_fibred_frontier_postgres.py \
            tests/storage/test_sparse_fibred_frontier_resolution.py \
            tests/storage/test_typed_frontier_candidate_constraints.py \
            tests/storage/test_proof_relevant_identity_postgres.py \
            tests/storage/test_proof_relevant_identity_acceptance.py
