name: Observe PR470 runtime patch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/trigger-pr470-runtime-patch.yml"
      - ".github/PR470_RUNTIME_TRIGGER"

permissions:
  contents: write

concurrency:
  group: observe-pr470-runtime-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/streaming-spacy-typed-parser
          persist-credentials: true
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Fetch and run reviewed transformation
        run: |
          set -euo pipefail
          git show origin/main:.github/scripts/apply_pr470_runtime.py \
            > /tmp/apply_pr470_runtime.py
          python /tmp/apply_pr470_runtime.py

      - name: Format and test focused surfaces
        run: |
          set -euo pipefail
          files=(
            src/pnf/numeric_operator_composition.py
            src/storage/postgres/numeric_hierarchy_planner.py
            src/storage/postgres/numeric_hyperfabric_store.py
            src/storage/postgres/spacy_numeric_projection.py
            tests/pnf/test_numeric_operator_composition.py
            tests/storage/test_numeric_hierarchy_planner.py
            tests/storage/test_spacy_numeric_projection.py
          )
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run python -m compileall -q \
            src/pnf/numeric_operator_composition.py \
            src/storage/postgres/numeric_hierarchy_planner.py \
            src/storage/postgres/numeric_hyperfabric_store.py \
            src/storage/postgres/spacy_numeric_projection.py
          uv run pytest -q \
            tests/pnf/test_numeric_operator_composition.py \
            tests/storage/test_numeric_hierarchy_planner.py \
            tests/storage/test_spacy_numeric_projection.py
          ! grep -q 'token_id_by_start.get' src/storage/postgres/spacy_numeric_projection.py
          ! grep -q 'row\[6\] or row\[0\]' src/storage/postgres/numeric_hyperfabric_store.py
          ! grep -q '\*prior_segments' src/storage/postgres/numeric_hierarchy_planner.py

      - name: Commit tested runtime conformance
        run: |
          set -euo pipefail
          mkdir -p .validation
          {
            printf 'contract=pr470-runtime-conformance:v6\n'
            printf 'source_head=%s\n' "$(git rev-parse HEAD)"
            printf 'explicit_root_evidence=1\n'
            printf 'missing_non_root_fails=1\n'
            printf 'nullable_head_fallback=0\n'
            printf 'constant_backpointer_cells=1\n'
            printf 'copied_paths=0\n'
            printf 'sentence_adjacency_index=1\n'
            printf 'planner_candidate_bound=O(N*W*B)\n'
            printf 'planner_state_bound=O(N*B)\n'
            printf 'sketch_union_bound=pending-runtime-C\n'
          } > .validation/pr470-runtime-conformance.txt
          git config user.name "sensiblaw-validation-bot"
          git config user.email "sensiblaw-validation-bot@users.noreply.github.com"
          git add \
            src/pnf/numeric_operator_composition.py \
            src/storage/postgres/numeric_hierarchy_planner.py \
            src/storage/postgres/numeric_hyperfabric_store.py \
            src/storage/postgres/spacy_numeric_projection.py \
            tests/storage/test_numeric_hierarchy_planner.py \
            tests/storage/test_spacy_numeric_projection.py \
            .validation/pr470-runtime-conformance.txt
          if ! git diff --cached --quiet; then
            git commit -m "Conform numeric PNF runtime to head and planner contracts"
            git pull --rebase origin agent/streaming-spacy-typed-parser
            git push origin HEAD:agent/streaming-spacy-typed-parser
          fi
