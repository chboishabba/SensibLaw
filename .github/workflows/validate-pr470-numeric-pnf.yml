name: Validate PR470 numeric PNF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-pr470-numeric-pnf.yml"

permissions:
  contents: read

concurrency:
  group: validate-pr470-numeric-pnf
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 50
    env:
      SENSIBLAW_LOCAL_POSTGRES_URL: postgresql://postgres@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/streaming-spacy-typed-parser
          persist-credentials: false

      - name: Compile authority surfaces
        run: |
          uv run python -m compileall -q \
            src/pnf/numeric_hyperfabric.py \
            src/pnf/numeric_operator_composition.py \
            src/policy/numeric_pnf_compilation.py \
            src/policy/streaming_spacy_parser_execution.py \
            src/storage/postgres/numeric_symbol_store.py \
            src/storage/postgres/numeric_hierarchy_planner.py \
            src/storage/postgres/numeric_hyperfabric_store.py \
            src/storage/postgres/spacy_numeric_projection.py \
            src/storage/postgres/spacy_parser_carrier.py \
            src/storage/postgres/streaming_spacy_execution.py \
            scripts/audit_json_sin_bin.py \
            scripts/audit_numeric_hyperfabric_authority.py

      - name: Ruff and authority gates
        run: |
          files=(
            src/pnf/numeric_hyperfabric.py
            src/pnf/numeric_operator_composition.py
            src/policy/numeric_pnf_compilation.py
            src/policy/streaming_spacy_parser_execution.py
            src/storage/postgres/numeric_symbol_store.py
            src/storage/postgres/numeric_hierarchy_planner.py
            src/storage/postgres/numeric_hyperfabric_store.py
            src/storage/postgres/spacy_numeric_projection.py
            src/storage/postgres/spacy_parser_carrier.py
            src/storage/postgres/streaming_spacy_execution.py
            scripts/audit_json_sin_bin.py
            scripts/audit_numeric_hyperfabric_authority.py
            tests/architecture/test_no_json_execution_authority.py
            tests/pnf/test_numeric_hyperfabric.py
            tests/pnf/test_numeric_operator_composition.py
            tests/policy/test_streaming_spacy_parser_execution.py
            tests/storage/test_numeric_hierarchy_planner.py
            tests/storage/test_numeric_hyperfabric_migration.py
            tests/storage/test_streaming_spacy_postgres_integration.py
          )
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"
          uv run python scripts/audit_json_sin_bin.py \
            --write .tmp/PR470_JSON_SIN_BIN.md \
            --check-authority
          uv run python scripts/audit_numeric_hyperfabric_authority.py

      - name: Unit tests
        run: |
          uv run pytest -q \
            tests/architecture/test_no_json_execution_authority.py \
            tests/pnf/test_numeric_hyperfabric.py \
            tests/pnf/test_numeric_operator_composition.py \
            tests/policy/test_streaming_spacy_parser_execution.py \
            tests/storage/test_numeric_hierarchy_planner.py \
            tests/storage/test_numeric_hyperfabric_migration.py \
            tests/storage/test_streaming_spacy_parser_migration.py \
            tests/storage/test_streaming_spacy_parser_model.py

      - name: Provision isolated PostgreSQL database
        id: database
        shell: bash
        run: |
          set -euo pipefail
          output="$(uv run python - <<'PY'
          import os
          from pathlib import Path
          from src.runtime.postgres_provisioning import provision_local_postgres

          run_ref = "validate-pr470-{}-{}".format(
              os.environ["GITHUB_RUN_ID"],
              os.environ["GITHUB_RUN_ATTEMPT"],
          )
          url, name = provision_local_postgres(
              admin_url=os.environ["SENSIBLAW_LOCAL_POSTGRES_URL"],
              migration_root=Path("database/postgres_migrations"),
              run_ref=run_ref,
          )
          print(url)
          print(name)
          PY
          )"
          printf 'database_url=%s\n' "$(printf '%s\n' "$output" | sed -n '1p')" >> "$GITHUB_OUTPUT"
          printf 'database_name=%s\n' "$(printf '%s\n' "$output" | sed -n '2p')" >> "$GITHUB_OUTPUT"

      - name: Real spaCy PostgreSQL integration
        env:
          DATABASE_URL: ${{ steps.database.outputs.database_url }}
        run: uv run pytest -q tests/storage/test_streaming_spacy_postgres_integration.py

      - name: No JSON columns in parser or PNF authority
        run: |
          psql '${{ steps.database.outputs.database_url }}' -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1
                FROM information_schema.columns
               WHERE table_schema = 'execution'
                 AND (
                   table_name LIKE 'semantic_parser_%'
                   OR table_name LIKE 'semantic_pnf_%'
                   OR table_name IN ('semantic_symbol', 'semantic_morph_set')
                 )
                 AND data_type IN ('json', 'jsonb')
            ) THEN
              RAISE EXCEPTION 'numeric parser or PNF authority contains JSON';
            END IF;
          END;
          $$;
          SQL

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PR470-NUMERIC-PNF-SIN-BIN
          path: .tmp/PR470_JSON_SIN_BIN.md
          if-no-files-found: warn

      - name: Drop isolated database
        if: always() && steps.database.outputs.database_name != ''
        run: |
          dropdb --if-exists \
            --host=127.0.0.1 \
            --port=5433 \
            --username=postgres \
            '${{ steps.database.outputs.database_name }}'
