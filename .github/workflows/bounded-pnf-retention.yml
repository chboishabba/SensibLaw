name: Bounded PNF retention validation

on:
  push:
    branches:
      - agent/bounded-pnf-retention
  pull_request:
    paths:
      - "src/runtime/document_execution_policy.py"
      - "src/runtime/bounded_document_scheduler.py"
      - "src/pnf/bounded_streaming_owner.py"
      - "tests/runtime/test_document_execution_policy.py"
      - "tests/runtime/test_bounded_document_scheduler.py"
      - "tests/pnf/test_bounded_streaming_owner.py"
      - "docs/bounded_document_execution.md"
      - ".github/workflows/bounded-pnf-retention.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install environment
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --extra test --extra dev

      - name: Lint bounded execution surfaces
        run: |
          uv run ruff check \
            src/runtime/document_execution_policy.py \
            src/runtime/bounded_document_scheduler.py \
            src/pnf/bounded_streaming_owner.py \
            tests/runtime/test_document_execution_policy.py \
            tests/runtime/test_bounded_document_scheduler.py \
            tests/pnf/test_bounded_streaming_owner.py

      - name: Check formatting
        run: |
          uv run ruff format --check \
            src/runtime/document_execution_policy.py \
            src/runtime/bounded_document_scheduler.py \
            src/pnf/bounded_streaming_owner.py \
            tests/runtime/test_document_execution_policy.py \
            tests/runtime/test_bounded_document_scheduler.py \
            tests/pnf/test_bounded_streaming_owner.py

      - name: Run bounded execution regressions
        run: |
          uv run pytest --maxfail=1 -q \
            tests/runtime/test_document_execution_policy.py \
            tests/runtime/test_bounded_document_scheduler.py \
            tests/pnf/test_bounded_streaming_owner.py \
            tests/pnf/test_streaming_fixed_point.py
