name: Validate PR 468 durable coordinator recovery

on:
  push:
    paths:
      - ".github/workflows/validate-pr468-durable-resume.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pr468-durable-resume
  cancel-in-progress: true

jobs:
  static-and-unit:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: agent/durable-work-item-resume
      - name: Compile changed Python surfaces
        run: |
          uv run python -m compileall -q \
            src/runtime/durable_work_items.py \
            src/runtime/durable_work_item_hardening.py \
            src/runtime/durable_stage_state.py \
            src/runtime/coordinator_lease_guard.py \
            src/policy/durable_work_item_execution.py \
            src/runtime/strict_postgres_execution.py \
            scripts/run_durable_coordinator_kill_probe.py
      - name: Ruff lint
        run: |
          uv run ruff check \
            src/runtime/durable_work_items.py \
            src/runtime/durable_work_item_hardening.py \
            src/runtime/durable_stage_state.py \
            src/runtime/coordinator_lease_guard.py \
            src/policy/durable_work_item_execution.py \
            src/policy/stage_budget_execution.py \
            src/runtime/strict_postgres_execution.py \
            scripts/run_durable_coordinator_kill_probe.py \
            tests/runtime/test_durable_work_items.py \
            tests/runtime/test_durable_work_item_hardening.py \
            tests/runtime/test_durable_stage_cursor.py \
            tests/storage/test_durable_work_item_migration.py
      - name: Ruff formatting
        run: |
          uv run ruff format --check \
            src/runtime/durable_work_items.py \
            src/runtime/durable_work_item_hardening.py \
            src/runtime/durable_stage_state.py \
            src/runtime/coordinator_lease_guard.py \
            src/policy/durable_work_item_execution.py \
            src/policy/stage_budget_execution.py \
            src/runtime/strict_postgres_execution.py \
            scripts/run_durable_coordinator_kill_probe.py \
            tests/runtime/test_durable_work_items.py \
            tests/runtime/test_durable_work_item_hardening.py \
            tests/runtime/test_durable_stage_cursor.py \
            tests/storage/test_durable_work_item_migration.py
      - name: Focused unit tests
        run: |
          uv run pytest -q \
            tests/runtime/test_durable_work_items.py \
            tests/runtime/test_durable_work_item_hardening.py \
            tests/runtime/test_durable_stage_cursor.py \
            tests/storage/test_durable_work_item_migration.py \
            tests/storage/test_strict_replay_identity.py \
            tests/runtime/test_strict_postgres_two_round_probe.py

  postgres-kill-resume:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      SENSIBLAW_LOCAL_POSTGRES_URL: postgresql://postgres@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: agent/durable-work-item-resume
      - name: Provision isolated retained database
        id: database
        shell: bash
        run: |
          set -euo pipefail
          output="$(uv run python - <<'PY'
          import os
          from pathlib import Path
          from src.runtime.postgres_provisioning import provision_local_postgres

          run_ref = "gha-pr468-{}-{}".format(
              os.environ["GITHUB_RUN_ID"],
              os.environ["GITHUB_RUN_ATTEMPT"],
          )
          url, name = provision_local_postgres(
              admin_url=os.environ["SENSIBLAW_LOCAL_POSTGRES_URL"],
              migration_root=Path("database/postgres_migrations"),
              run_ref=run_ref,
          )
          print(url)
          print(name)
          PY
          )"
          database_url="$(printf '%s\n' "$output" | sed -n '1p')"
          database_name="$(printf '%s\n' "$output" | sed -n '2p')"
          test -n "$database_url"
          test -n "$database_name"
          printf 'database_url=%s\n' "$database_url" >> "$GITHUB_OUTPUT"
          printf 'database_name=%s\n' "$database_name" >> "$GITHUB_OUTPUT"
      - name: Run destructive coordinator-kill probe
        run: |
          set -euo pipefail
          rm -rf .tmp/durable-work-item-kill-probe
          uv run python scripts/run_durable_coordinator_kill_probe.py \
            --database-url '${{ steps.database.outputs.database_url }}' \
            --artifact-root .tmp/durable-work-item-kill-probe \
            --run-ref 'durable-kill-probe:${{ github.run_id }}:${{ github.run_attempt }}' \
            --workers 4 \
            --work-items 12 \
            --fast-items 4 \
            --lease-seconds 2
          jq -e '
            .state == "passed"
            and .recomputed_completed_work == 0
            and .orphan_worker_count == 0
            and .completed_after_resume == 12
          ' .tmp/durable-work-item-kill-probe/coordinator-kill-probe-report.json
      - name: Verify durable rows and outbox
        run: |
          set -euo pipefail
          psql '${{ steps.database.outputs.database_url }}' -v ON_ERROR_STOP=1 -c "
            SELECT state, count(*)
            FROM execution.semantic_work_item
            GROUP BY state
            ORDER BY state;
            SELECT event_type_ref, count(*)
            FROM execution.semantic_outbox
            WHERE event_type_ref = 'semantic.work-item.completed.v1'
            GROUP BY event_type_ref;
          "
      - name: Drop isolated database
        if: always() && steps.database.outputs.database_name != ''
        run: |
          dropdb --if-exists \
            --host=127.0.0.1 \
            --port=5433 \
            --username=postgres \
            '${{ steps.database.outputs.database_name }}'
