name: Streamed numeric spaCy and PNF validation

on:
  pull_request:
    branches: [agent/no-json-typed-execution]
    paths:
      - "src/nlp/spacy_adapter.py"
      - "src/pnf/numeric_*.py"
      - "src/policy/numeric_pnf_compilation.py"
      - "src/policy/stage_budget_execution.py"
      - "src/policy/streaming_spacy_parser_execution.py"
      - "src/storage/postgres/numeric_*.py"
      - "src/storage/postgres/spacy_*.py"
      - "src/storage/postgres/streaming_spacy_execution.py"
      - "database/postgres_migrations/038_*.sql"
      - "database/postgres_migrations/039_*.sql"
      - "database/postgres_migrations/04[0-8]_*.sql"
      - "tests/pnf/test_numeric_*.py"
      - "tests/storage/test_numeric_*.py"
      - "tests/storage/test_streaming_spacy_*.py"
      - "tests/policy/test_streaming_spacy_parser_execution.py"
      - "tests/architecture/test_no_json_execution_authority.py"
      - "scripts/audit_json_sin_bin.py"
      - "scripts/audit_numeric_hyperfabric_authority.py"
      - "docs/architecture/JSON_SIN_BIN.md"
      - ".github/workflows/streaming-spacy-typed-parser-pr.yml"

permissions:
  contents: read

concurrency:
  group: streamed-numeric-spacy-pnf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 50
    env:
      SENSIBLAW_LOCAL_POSTGRES_URL: postgresql://postgres@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compile numeric parser and PNF surfaces
        run: |
          uv run python -m compileall -q \
            src/nlp/spacy_adapter.py \
            src/pnf/numeric_hyperfabric.py \
            src/pnf/numeric_operator_composition.py \
            src/policy/numeric_pnf_compilation.py \
            src/policy/streaming_spacy_parser_execution.py \
            src/storage/postgres/numeric_symbol_store.py \
            src/storage/postgres/numeric_hyperfabric_store.py \
            src/storage/postgres/spacy_numeric_projection.py \
            src/storage/postgres/spacy_parser_carrier.py \
            src/storage/postgres/spacy_parser_model.py \
            src/storage/postgres/spacy_parser_store.py \
            src/storage/postgres/streaming_spacy_execution.py \
            scripts/audit_json_sin_bin.py \
            scripts/audit_numeric_hyperfabric_authority.py

      - name: Ruff lint and formatting
        run: |
          files=(
            src/nlp/spacy_adapter.py
            src/pnf/numeric_hyperfabric.py
            src/pnf/numeric_operator_composition.py
            src/policy/numeric_pnf_compilation.py
            src/policy/stage_budget_execution.py
            src/policy/streaming_spacy_parser_execution.py
            src/storage/postgres/numeric_symbol_store.py
            src/storage/postgres/numeric_hyperfabric_store.py
            src/storage/postgres/spacy_numeric_projection.py
            src/storage/postgres/spacy_parser_carrier.py
            src/storage/postgres/spacy_parser_model.py
            src/storage/postgres/spacy_parser_store.py
            src/storage/postgres/streaming_spacy_execution.py
            scripts/audit_json_sin_bin.py
            scripts/audit_numeric_hyperfabric_authority.py
            tests/architecture/test_no_json_execution_authority.py
            tests/pnf/test_numeric_hyperfabric.py
            tests/pnf/test_numeric_operator_composition.py
            tests/policy/test_streaming_spacy_parser_execution.py
            tests/storage/test_numeric_hyperfabric_migration.py
            tests/storage/test_streaming_spacy_parser_migration.py
            tests/storage/test_streaming_spacy_parser_model.py
            tests/storage/test_streaming_spacy_postgres_integration.py
          )
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"

      - name: No-JSON and numeric authority tests
        run: |
          uv run python scripts/audit_json_sin_bin.py \
            --write .tmp/STREAMING_SPACY_JSON_SIN_BIN.md \
            --check-authority
          uv run python scripts/audit_numeric_hyperfabric_authority.py
          uv run pytest -q \
            tests/architecture/test_no_json_execution_authority.py \
            tests/pnf/test_numeric_hyperfabric.py \
            tests/pnf/test_numeric_operator_composition.py \
            tests/policy/test_streaming_spacy_parser_execution.py \
            tests/storage/test_numeric_hyperfabric_migration.py \
            tests/storage/test_streaming_spacy_parser_migration.py \
            tests/storage/test_streaming_spacy_parser_model.py

      - name: Provision isolated database and apply every migration
        id: database
        shell: bash
        run: |
          set -euo pipefail
          output="$(uv run python - <<'PY'
          import os
          from pathlib import Path
          from src.runtime.postgres_provisioning import provision_local_postgres

          run_ref = "streaming-numeric-spacy-pnf-{}-{}".format(
              os.environ["GITHUB_RUN_ID"],
              os.environ["GITHUB_RUN_ATTEMPT"],
          )
          url, name = provision_local_postgres(
              admin_url=os.environ["SENSIBLAW_LOCAL_POSTGRES_URL"],
              migration_root=Path("database/postgres_migrations"),
              run_ref=run_ref,
          )
          print(url)
          print(name)
          PY
          )"
          database_url="$(printf '%s\n' "$output" | sed -n '1p')"
          database_name="$(printf '%s\n' "$output" | sed -n '2p')"
          test -n "$database_url"
          test -n "$database_name"
          printf 'database_url=%s\n' "$database_url" >> "$GITHUB_OUTPUT"
          printf 'database_name=%s\n' "$database_name" >> "$GITHUB_OUTPUT"

      - name: Run PostgreSQL and spaCy integration probe
        env:
          DATABASE_URL: ${{ steps.database.outputs.database_url }}
        run: |
          uv run pytest -q tests/storage/test_streaming_spacy_postgres_integration.py

      - name: Verify parser and PNF schemas have no JSON columns
        run: |
          psql '${{ steps.database.outputs.database_url }}' -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'execution'
                AND (
                  table_name LIKE 'semantic_parser_%'
                  OR table_name LIKE 'semantic_pnf_%'
                  OR table_name IN ('semantic_symbol', 'semantic_morph_set')
                )
                AND data_type IN ('json', 'jsonb')
            ) THEN
              RAISE EXCEPTION 'numeric parser or PNF schema contains JSON authority';
            END IF;
          END;
          $$;
          SQL

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STREAMING-NUMERIC-SPACY-PNF-SIN-BIN
          path: .tmp/STREAMING_SPACY_JSON_SIN_BIN.md
          if-no-files-found: warn

      - name: Drop isolated database
        if: always() && steps.database.outputs.database_name != ''
        run: |
          dropdb --if-exists \
            --host=127.0.0.1 \
            --port=5433 \
            --username=postgres \
            '${{ steps.database.outputs.database_name }}'
