name: Bounded PNF retention validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/self-hosted-bounded-pnf-validation.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to validate"
        required: false
        default: "agent/repair-corpus-progress-stage-lifecycle"

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      SENSIBLAW_FINALIZATION_BATCH_SIZE: "2"
      SENSIBLAW_FINALIZATION_STALL_SECONDS: "120"
      SENSIBLAW_PROGRESS_WAIT_HEARTBEAT_SECONDS: "1"
      SENSIBLAW_STAGE_SERIALIZATION_HARD_MIB: "3072"
      SENSIBLAW_STAGE_PUBLICATION_HARD_MIB: "3072"
      SENSIBLAW_STAGE_PARITY_HARD_MIB: "2560"
      SENSIBLAW_CHECKPOINT_DISK_BUDGET_MIB: "8192"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'agent/repair-corpus-progress-stage-lifecycle' }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install environment
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --extra test --extra dev

      - name: Lint distributed execution surfaces
        run: |
          uv run ruff check \
            src/pnf/streaming_build_reader.py \
            src/pnf/streaming_reduction_projection.py \
            src/pnf/fibred_build_projection.py \
            src/policy/__init__.py \
            src/policy/bounded_operational_execution.py \
            src/policy/closure_liveness_execution.py \
            src/policy/closure_finalization_hardening.py \
            src/policy/reference_backed_finalization.py \
            src/policy/fibred_operational_corpus_compilation.py \
            src/policy/progress_observability_execution.py \
            src/policy/stage_budget_execution.py \
            src/policy/semantic_receipt_enrichment.py \
            src/runtime/checkpoint_retention.py \
            src/runtime/distributed_semantic_worker.py \
            src/runtime/reference_parity.py \
            src/runtime/reference_receipt.py \
            src/runtime/stage_memory_budget.py \
            src/storage/postgres/batched_streaming_semantic_store.py \
            src/storage/postgres/distributed_semantic_execution_store.py \
            src/storage/postgres/reference_publication_authority.py \
            src/storage/postgres/reference_streaming_semantic_store.py \
            scripts/run_exact_0008_parallel_acceptance.py \
            scripts/run_post_closure_probe.py \
            tests/pnf/test_streaming_build_reader.py \
            tests/policy/test_closure_liveness_execution.py \
            tests/policy/test_progress_observability_execution.py \
            tests/runtime/test_checkpoint_retention.py \
            tests/runtime/test_distributed_semantic_worker.py \
            tests/runtime/test_reference_parity.py \
            tests/runtime/test_reference_receipt.py \
            tests/runtime/test_stage_memory_budget.py \
            tests/storage/test_distributed_semantic_execution_store.py

      - name: Check formatting
        run: |
          uv run ruff format --check \
            src/pnf/streaming_build_reader.py \
            src/pnf/streaming_reduction_projection.py \
            src/pnf/fibred_build_projection.py \
            src/policy/__init__.py \
            src/policy/closure_liveness_execution.py \
            src/policy/closure_finalization_hardening.py \
            src/policy/reference_backed_finalization.py \
            src/policy/fibred_operational_corpus_compilation.py \
            src/policy/progress_observability_execution.py \
            src/policy/stage_budget_execution.py \
            src/policy/semantic_receipt_enrichment.py \
            src/runtime/checkpoint_retention.py \
            src/runtime/distributed_semantic_worker.py \
            src/runtime/reference_parity.py \
            src/runtime/reference_receipt.py \
            src/runtime/stage_memory_budget.py \
            src/storage/postgres/batched_streaming_semantic_store.py \
            src/storage/postgres/distributed_semantic_execution_store.py \
            src/storage/postgres/reference_publication_authority.py \
            src/storage/postgres/reference_streaming_semantic_store.py \
            scripts/run_exact_0008_parallel_acceptance.py \
            scripts/run_post_closure_probe.py \
            tests/pnf/test_streaming_build_reader.py \
            tests/policy/test_closure_liveness_execution.py \
            tests/policy/test_progress_observability_execution.py \
            tests/runtime/test_checkpoint_retention.py \
            tests/runtime/test_distributed_semantic_worker.py \
            tests/runtime/test_reference_parity.py \
            tests/runtime/test_reference_receipt.py \
            tests/runtime/test_stage_memory_budget.py \
            tests/storage/test_distributed_semantic_execution_store.py

      - name: Run distributed execution regressions
        run: |
          uv run pytest --maxfail=1 -q \
            tests/runtime/test_bounded_document_scheduler.py \
            tests/runtime/test_checkpoint_retention.py \
            tests/runtime/test_distributed_semantic_worker.py \
            tests/runtime/test_reference_parity.py \
            tests/runtime/test_reference_receipt.py \
            tests/runtime/test_stage_memory_budget.py \
            tests/pnf/test_bounded_streaming_owner.py \
            tests/pnf/test_streaming_fixed_point.py \
            tests/pnf/test_streaming_build_reader.py \
            tests/policy/test_bounded_operational_execution.py \
            tests/policy/test_closure_liveness_execution.py \
            tests/policy/test_progress_observability_execution.py \
            tests/policy/test_semantic_receipt_enrichment.py \
            tests/storage/test_distributed_semantic_execution_store.py

      - name: Validate migration and formal invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path("database/postgres_migrations/026_distributed_semantic_execution.sql").read_text()
          for table in (
              "semantic_owner_stream",
              "semantic_job",
              "semantic_delta_admission",
              "semantic_graph_manifest",
              "semantic_finalization_checkpoint",
              "semantic_fixed_point_receipt",
              "semantic_execution_receipt",
              "publication_build",
          ):
              assert table in migration

          store = Path("src/storage/postgres/distributed_semantic_execution_store.py").read_text()
          assert "FOR UPDATE SKIP LOCKED" in store
          assert "lease_epoch" in store
          assert "expected_owner_revision" in store
          assert "commit_publication" in store

          tla = Path("formal/DistributedSemanticExecution.tla").read_text()
          for invariant in (
              "LeaseFencingSafety",
              "ExactlyOneSemanticAdmission",
              "OwnerRevisionAgreement",
              "FixedPointSoundness",
              "Termination",
          ):
              assert invariant in tla
          PY
