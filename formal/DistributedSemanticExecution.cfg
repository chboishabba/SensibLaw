CONSTANTS
    Jobs = {j1, j2, j3}
    Owners = {o1, o2}
    Workers = {w1, w2}
    JobOwner = [j \in {j1, j2, j3} |-> IF j = j3 THEN o2 ELSE o1]
    Dependencies = [j \in {j1, j2, j3} |-> IF j = j2 THEN {j1} ELSE {}]
    DependencyRank = [j \in {j1, j2, j3} |-> IF j = j2 THEN 1 ELSE 0]
    MaxAttempts = 2

SPECIFICATION FairSpec

INVARIANTS
    TypeOK
    LeaseFencingSafety
    ExactlyOneSemanticAdmission
    OwnerRevisionAgreement
    OwnerRevisionCountsAdmissions
    NoDuplicateOwnerRevision
    CompletedDependencies
    FixedPointSoundness

PROPERTY Termination
